services:
  backend:
    build: ./api
    container_name: payoutflow-api
    env_file:
      - path: ./api/.env
        required: false
    environment:
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      SECRET_KEY: ${SECRET_KEY:-compose-dev-only-insecure-key-change-me}
      DEBUG: ${DEBUG:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./web
    container_name: payoutflow-web
    environment:
      INTERNAL_API_URL: "http://backend:8000/api"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
